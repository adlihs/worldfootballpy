[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "worldfootballpy"
version = "0.1.0"
description = "Port a Python del paquete de R worldfootballR: datos de FBref, Transfermarkt y Understat en DataFrames de pandas."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Edmund Neil Quiros" }]
keywords = ["football", "soccer", "fbref", "transfermarkt", "understat", "scraping", "worldfootballR"]
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
    "lxml>=4.9",
    "cssselect>=1.2",
    "rdata>=0.11",
]

[project.optional-dependencies]
progress = ["tqdm"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/adlihs/worldfootballpy"
"Original R package" = "https://github.com/JaseZiv/worldfootballR"

[tool.setuptools.packages.find]
include = ["worldfootballpy*"]
